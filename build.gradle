plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = "Nucleoid"
        url = "https://maven.nucleoid.xyz/releases"
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        teartag {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    compileOnly "eu.pb4:trinkets:${project.trinkets_version}"
    runtimeOnly "eu.pb4:trinkets:${project.trinkets_version}"

    include implementation("org.tomlj:tomlj:${project.tomlj_version}")
    include implementation("org.antlr:antlr4-runtime:${project.antlr_version}")

    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

def resourceVersion = project.version

processResources {
    inputs.property "version", resourceVersion
    filesMatching("fabric.mod.json") {
        expand "version": resourceVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = "UTF-8"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
}
